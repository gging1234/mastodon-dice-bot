
name: Mastodon Dice Bot

# 5분마다 자동 실행하거나 수동으로 실행할 수 있습니다.
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

# 같은 봇이 동시에 여러 번 실행되는 것을 방지합니다.
concurrency:
  group: mastodon-dice-bot
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-24.04

    steps:
      # 저장소에 있는 Python 코드 불러오기
      - name: Load bot code
        uses: actions/checkout@v5

      # Python 3.12 설치
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 봇 실행에 필요한 라이브러리 설치
      - name: Install libraries
        run: pip install -r requirements.txt

      # 마스토돈 봇 실행
      # 실제 답글 발송과 처리한 알림 삭제를 활성화합니다.
      - name: Run Mastodon bot
        env:
          MASTODON_CLIENT_ID: ${{ secrets.MASTODON_CLIENT_ID }}
          MASTODON_CLIENT_SECRET: ${{ secrets.MASTODON_CLIENT_SECRET }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          LIVE_MODE: 'true'
        run: python main.py
